  <rect x="18" y="20" width="30" height="34" rx="5" fill="#d4eb83" transform="rotate(-8 18 20)"/>
  <rect x="37" y="25" width="29" height="35" rx="5" fill="#f0f2e8"/>
  <path d="M44 36h15M44 43h12M44 50h9" stroke="#65734a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="62" cy="61" r="5" fill="#d4eb83"/>
