name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Agent Skills package
        run: python scripts/validate_skill.py .

      - name: Compile Python sources
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(path), doraise=True) for root in ('scripts', 'hooks', 'tests') for path in pathlib.Path(root).rglob('*.py')]"

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  optional-crypto:
    name: Optional encryption adapter
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install the optional cryptography adapter
        run: python -m pip install --disable-pip-version-check "cryptography>=46,<47"

      - name: Run the full suite with encryption enabled
        run: python -m unittest discover -s tests -p "test_*.py" -v

  public-release-gate:
    name: Public release gate
    runs-on: ubuntu-latest
    needs: [test, optional-crypto]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Run the public ship gate
        run: python scripts/ship_gate.py
