name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate Agent Skills package
        run: python scripts/validate_skill.py .

      - name: Compile Python sources
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(path), doraise=True) for root in ('scripts', 'hooks', 'tests') for path in pathlib.Path(root).rglob('*.py')]"

      - name: Run release test suite
        run: python -m unittest discover -s tests -p "test_*.py" -q

      - name: Build source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-snapshot}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="second-brain-${version}/" "${GITHUB_SHA}" \
            -o "dist/second-brain-${version}.tar.gz"
          sha256sum dist/second-brain-${version}.tar.gz > dist/SHA256SUMS

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
