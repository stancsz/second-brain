name: Feature request
description: Propose a focused user-visible improvement and its proof plan.
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: job
    attributes:
      label: Repeated user job
      description: Who has the problem, what are they trying to do, and how often?
      placeholder: A developer switching between two agent hosts needs to...
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: Explain the current workaround or failure with synthetic examples only.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation.
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: Acceptance evidence
      description: State the automated test or live handshake that would prove the outcome.
      placeholder: Repo-tested when... Live-verified when...
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Portability, privacy, and compatibility impact
      description: Note changes to the Bundle, SQLite projection, network boundary, agent hosts, storage, or open-core split.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: This proposal and its examples contain no private note contents, transcripts, credentials, keys, DSNs, or personal data.
          required: true
