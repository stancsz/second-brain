[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-cli"
version = "0.1.0"
description = "A local-first knowledge graph CLI for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
encryption = ["cryptography>=41"]

[project.scripts]
brain = "brain_cli:main"

[tool.setuptools]
packages = []
py-modules = ["brain", "brain_cli", "brain_doctor", "brain_mcp", "bundle", "crypto", "host_matrix", "okf", "storage", "storage_cli", "store", "sync"]
package-dir = {"" = "scripts"}
